name: iosApp
options:
  bundleIdPrefix: com.instaconnect
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: GramPulse
        PRODUCT_BUNDLE_IDENTIFIER: com.instaconnect.grampulse
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: 
          - $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework
        OTHER_LDFLAGS:
          - -framework shared
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
